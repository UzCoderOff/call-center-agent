# Required because the project depends on AndroidX libraries
# (androidx.appcompat, androidx.work, etc.) — without these, Gradle's
# checkDebugAarMetadata task fails with "AndroidX dependencies... but
# android.useAndroidX is not enabled."
android.useAndroidX=true
android.enableJetifier=false

# Standard perf defaults
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true
