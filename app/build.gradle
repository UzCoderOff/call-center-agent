plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Google push needs app/google-services.json (the Firebase project's settings).
// It isn't in git (the repo is public): CI writes it from the
// GOOGLE_SERVICES_JSON_B64 secret. Without it the app builds, just without
// push — calls then ring only while Ledger is open.
if (file("google-services.json").exists()) {
    apply plugin: 'com.google.gms.google-services'
}

// Where the app points. Set in gradle.properties — change them there (e.g.
// once the firm has its own domain) and rebuild; nothing is typed on phones.
def portalUrl = project.findProperty("ledger.portalUrl") ?: "https://call-center-frontend-hazel.vercel.app"
def apiUrl = project.findProperty("ledger.apiUrl") ?: "https://82.115.51.61.nip.io"
// Testing on the PC's Android emulator (-Pledger.emulator=true): adds the
// emulator's processor type. A debug build may also reach the PC's own test
// servers over plain http (10.0.2.2 only: src/debug).
def forEmulator = project.findProperty("ledger.emulator") == "true"

// Release signing. Every release must be signed with the SAME key, or
// Android refuses to install an update over the previous version. The key
// lives outside the repo; CI provides it through environment variables
// (see .github/workflows/build.yml and tools/create-signing-key.sh).
def keystorePath = System.getenv("LEDGER_KEYSTORE_PATH")

android {
    namespace 'com.lawfirm.callagent'
    compileSdk 34

    defaultConfig {
        applicationId "com.lawfirm.callagent"
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "3.2.2"

        // The calling engine's native code: 64- and 32-bit ARM phones only
        // (plus the PC's emulator for a test build), to keep the app small.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
            if (forEmulator) abiFilters 'x86_64'
        }

        buildConfigField "String", "PORTAL_URL", "\"${portalUrl}\""
        buildConfigField "String", "API_URL", "\"${apiUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv("LEDGER_KEYSTORE_PASSWORD")
                keyAlias System.getenv("LEDGER_KEY_ALIAS")
                keyPassword System.getenv("LEDGER_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packaging {
        // Keep native libraries compressed in the APK (smaller download).
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // Calling through Ledger's phone line (SIP over TLS, encrypted audio).
    implementation 'org.linphone:linphone-sdk-android:5.4.126'
    // Google push: wakes the app for a call when it's closed.
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
