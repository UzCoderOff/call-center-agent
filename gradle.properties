# Required because the project depends on AndroidX libraries
# (androidx.appcompat, androidx.work, etc.) — without these, Gradle's
# checkDebugAarMetadata task fails with "AndroidX dependencies... but
# android.useAndroidX is not enabled."
android.useAndroidX=true
android.enableJetifier=false

# Standard perf defaults
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true

# Where the app points (baked into the APK — nothing to type on the phone).
#   portalUrl: the portal website the app shows (Vercel)
#   apiUrl:    the backend on the VPS (sign-in and call uploads go here directly)
# Change these when the firm gets its own domain, then build a new version.
ledger.portalUrl=https://call-center-frontend-hazel.vercel.app
ledger.apiUrl=https://82.115.51.61.nip.io
