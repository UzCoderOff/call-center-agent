name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Skip the legacy 'tools' package this action tries by default —
          # it no longer exists in Google's SDK repo and fails the step.
          # We only need cmdline-tools (installed automatically) plus
          # platform-tools; platform + build-tools are installed explicitly
          # in the next step.
          packages: "platform-tools"

      - name: Install SDK platform + build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: call-agent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
